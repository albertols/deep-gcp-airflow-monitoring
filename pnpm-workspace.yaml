packages:
  - apps/*
  - packages/*
  - packages/adapters/*
  - tools/scripts

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@fastify/static@10.1.10'

# openapi-typescript declares a TypeScript ^5 peer range; TypeScript 6 works (ADR-0002).
peerDependencyRules:
  allowedVersions:
    typescript: '6'
